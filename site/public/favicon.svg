<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Vinyl record background -->
  <circle cx="64" cy="64" r="62" fill="#0A0A0A" stroke="#2A2420" stroke-width="1"/>
  <!-- Outer groove ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#2A2420" stroke-width="0.5"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#2A2420" stroke-width="0.3"/>
  <circle cx="64" cy="64" r="48" fill="none" stroke="#2A2420" stroke-width="0.5"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#2A2420" stroke-width="0.3"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#2A2420" stroke-width="0.5"/>
  <circle cx="64" cy="64" r="36" fill="none" stroke="#2A2420" stroke-width="0.3"/>
  <circle cx="64" cy="64" r="32" fill="none" stroke="#2A2420" stroke-width="0.5"/>
  <circle cx="64" cy="64" r="28" fill="none" stroke="#2A2420" stroke-width="0.3"/>
  <!-- Label area -->
  <circle cx="64" cy="64" r="22" fill="#161412"/>
  <circle cx="64" cy="64" r="22" fill="none" stroke="#D4A574" stroke-width="0.8" opacity="0.4"/>
  <!-- Amber label with gradient -->
  <circle cx="64" cy="64" r="18" fill="#1E1A16"/>
  <circle cx="64" cy="64" r="18" fill="url(#labelGrad)" opacity="0.15"/>
  <!-- "LM" text -->
  <text x="64" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#D4A574" letter-spacing="-0.5">LM</text>
  <text x="64" y="74" text-anchor="middle" font-family="'Inter', sans-serif" font-size="5.5" fill="#8A7E72" letter-spacing="2">MIXES</text>
  <!-- Center spindle -->
  <circle cx="64" cy="64" r="3" fill="#0A0A0A" stroke="#2A2420" stroke-width="0.5"/>
  <!-- Subtle light reflection -->
  <path d="M30 30 Q64 20 98 30 Q80 50 64 64 Q48 50 30 30Z" fill="white" opacity="0.02"/>
  <defs>
    <radialGradient id="labelGrad">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#8A7E72"/>
    </radialGradient>
  </defs>
</svg>
